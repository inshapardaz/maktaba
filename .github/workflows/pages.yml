name: Deploy docs to GitHub Pages

# Publishes docs/ (the VitePress help site, plus the Privacy Policy / Terms & Conditions pages -
# see docs/privacy-policy.md, docs/terms-and-conditions.md) to GitHub Pages. Only main pushes that
# actually touch docs/ trigger a deploy - the same content also ships inside the packaged app as
# offline Help (see CLAUDE.md's "Help & onboarding" section / scripts/build-help-content.mjs),
# this is just the public, linkable copy (used by AboutSettings.tsx's Privacy Policy/Terms links,
# and needed as a public URL for cloud provider OAuth consent screens).
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build docs
        run: npm run docs:build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
