name: Release

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version part to auto-increment from the latest existing tag (ignored if 'tag' is set below)"
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      tag:
        description: 'Optional explicit release tag (e.g. "v0.1.0"), overriding auto-increment. Leave blank to auto-increment from the latest tag using "bump" above. If the tag does not exist yet, it will be created pointing at the selected branch/commit.'
        required: false

permissions:
  contents: write

# A PR build re-pushes commits often and each run packages 3 platforms, so superseded PR runs are
# cancelled - but never a real tag-push/workflow_dispatch release, since those are keyed by their
# own distinct ref (refs/tags/vX vs refs/pull/N/merge) and should always run to completion.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  determine-version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      # Only needed to read the existing tag list for auto-increment below (a tag-push trigger
      # already knows its own tag from GITHUB_REF_NAME without this) - fetch-depth: 0 pulls full
      # history/tags rather than the default single-commit shallow clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag and version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # No real tag is ever created for a PR build (the release job below is skipped for
            # this event) - just the next patch version, beta-suffixed with the PR number so
            # packaged installers are distinguishable and traceable back to the PR that built them.
            LATEST_TAG="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)"
            LATEST="${LATEST_TAG#v}"
            LATEST="${LATEST:-0.0.0}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"
            PATCH=$((PATCH + 1))
            TAG="v${MAJOR}.${MINOR}.${PATCH}-beta.${{ github.event.pull_request.number }}"
            echo "PR build - using $TAG"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            LATEST_TAG="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)"
            LATEST="${LATEST_TAG#v}"
            LATEST="${LATEST:-0.0.0}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"
            case "${{ inputs.bump }}" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              *)     PATCH=$((PATCH + 1)) ;;
            esac
            TAG="v${MAJOR}.${MINOR}.${PATCH}"
            echo "No explicit tag given - auto-incrementing (${{ inputs.bump }}) from latest tag '${LATEST_TAG:-<none>}' to $TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "Tag '$TAG' must look like vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-beta.N (e.g. v0.1.0, v0.1.0-beta.42)" >&2
            exit 1
          fi
          # Only relevant for workflow_dispatch: a tag-push trigger's own tag legitimately already
          # exists (it's what triggered this run), and a PR build's beta tag is never actually
          # created as a git tag - so skip the check for both.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag '$TAG' already exists" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    name: Package (${{ matrix.platform }})
    needs: determine-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            package_script: package:win
            artifact_name: maktaba-windows
            artifact_glob: apps/desktop/release/*.exe
          - platform: macos
            os: macos-latest
            package_script: package:mac
            artifact_name: maktaba-macos
            artifact_glob: apps/desktop/release/*.dmg
          - platform: linux
            os: ubuntu-latest
            package_script: package:linux
            artifact_name: maktaba-linux
            artifact_glob: apps/desktop/release/*.AppImage
    steps:
      - uses: actions/checkout@v4
        # No explicit `ref`: for a tag push this checks out the tag itself;
        # for workflow_dispatch it checks out the tip of the selected branch
        # (the tag may not exist as a git ref yet — action-gh-release creates
        # it from this same commit in the release job below).

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set package version
        run: node scripts/set-version.mjs ${{ needs.determine-version.outputs.version }}

      - name: Build and package
        run: npm run ${{ matrix.package_script }}
        env:
          # Signs + notarizes the mac dmg when an Apple Developer ID certificate and
          # notarization credentials are configured as repo secrets (see README's "Known
          # issues" section) - without them, electron-builder falls back to an unsigned
          # build (same as before) rather than failing, since CSC_IDENTITY_AUTO_DISCOVERY
          # is only turned on when a cert is actually present. These are scoped to the
          # macos leg only so a mac cert is never handed to the windows/linux signers.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.platform == 'macos' && secrets.MAC_CERTIFICATE != '' }}
          CSC_LINK: ${{ matrix.platform == 'macos' && secrets.MAC_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'macos' && secrets.MAC_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'macos' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_TEAM_ID || '' }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: [determine-version, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release and upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.determine-version.outputs.tag }}
          name: Maktaba ${{ needs.determine-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: artifacts/*
