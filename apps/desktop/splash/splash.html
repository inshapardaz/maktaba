<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Maktaba</title>
    <style>
      /* Approximates Mantine's own default light/dark body colors (see theme.ts) so this doesn't
         clash with the real app window it hands off to a moment later. */
      :root {
        --bg: #ffffff;
        --fg: #1a1b1e;
        --dimmed: #868e96;
        --spinner-track: #e9ecef;
        --spinner-arc: #1a1b1e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1a1b1e;
          --fg: #f8f9fa;
          --dimmed: #909296;
          --spinner-track: #2c2e33;
          --spinner-arc: #f8f9fa;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: var(--bg);
        color: var(--fg);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      img {
        width: 96px;
        height: 96px;
        border-radius: 20px;
      }
      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.2px;
      }
      .spinner {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        border: 3px solid var(--spinner-track);
        border-top-color: var(--spinner-arc);
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <img src="icon.png" alt="" />
    <h1>Maktaba</h1>
    <div class="spinner"></div>
  </body>
</html>
